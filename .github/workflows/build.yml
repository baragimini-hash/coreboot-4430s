name: Build coreboot for HP ProBook 4430s

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # lets you trigger a build from the Actions tab

permissions:
  contents: read

# coreboot's util/crossgcc/buildgcc checks whether $CC supports Ada to decide
# whether to build the cross toolchain with the Ada front-end. libgfxinit
# (Intel native graphics init) is written in Ada and cannot compile without it.
#
# Ubuntu 24.04 (noble) ships gcc-13 as the system default. Installing
# gnat-14 alone is NOT enough -- it provides a standalone GNAT but does
# NOT add Ada to the gcc-13 binary that $CC points to. So we install
# gcc-14 + gcc-14-ada and point $CC at gcc-14, which makes buildgcc
# detect Ada support and build crossgcc-i386 with Ada. gcc-14-ada also
# exists in noble (-updates); gnat-14 covers any standalone-GNAT need.
env:
  CC: gcc-14

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out port
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ gcc-14 gcc-14-ada gnat-14 bison flex m4 \
            zlib1g-dev libssl-dev libncurses-dev \
            python3 python3-pip \
            git curl wget xz-utils bzip2 patch \
            acpica-tools nasm uuid-dev imagemagick

      - name: Build coreboot.rom (clone + crossgcc + make)
        run: bash ci_build.sh

      - name: Upload coreboot.rom
        uses: actions/upload-artifact@v4
        with:
          name: coreboot-4430s
          path: coreboot/build/coreboot.rom
          if-no-files-found: error
