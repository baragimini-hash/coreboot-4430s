name: Build coreboot for HP ProBook 4430s

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # lets you trigger a build from the Actions tab

permissions:
  contents: read

# coreboot's util/crossgcc/buildgcc (have_gnat, lines ~232-260 of buildgcc)
# requires ALL THREE of these to enable Ada in the cross toolchain (needed by
# libgfxinit, which is Ada source):
#   1. `$CC -print-prog-name=gnat1` must resolve to an executable file.
#      `gnat-14` ships /usr/lib/gcc/x86_64-linux-gnu/14/gnat1, so
#      `gcc-14 -print-prog-name=gnat1` returns that path.
#   2. `gnatbind` (unversioned) must be on PATH -- provided by the symlink
#      in ci_build.sh (-> /usr/bin/gnatbind-14).
#   3. `gnatmake` (unversioned) must be on PATH -- same symlink trick.
# Ubuntu 24.04 (noble) does NOT package `gcc-13-ada` or `gcc-14-ada` (the
# Ada front-end ships inside `gnat-14`), so we install `gcc-14` + `gnat-14`
# and point $CC at gcc-14. ci_build.sh then symlinks the unversioned GNAT
# tools (gnat / gnatbind / gnatmake / gnatlink / gnatclean) so buildgcc's
# `command -v` checks pass.
env:
  CC: gcc-14

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out port
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ gcc-14 gnat-14 bison flex m4 \
            zlib1g-dev libssl-dev libncurses-dev \
            python3 python3-pip \
            git curl wget xz-utils bzip2 patch \
            acpica-tools nasm uuid-dev imagemagick

      - name: Build coreboot.rom (clone + crossgcc + make)
        run: bash ci_build.sh

      - name: Upload coreboot.rom
        uses: actions/upload-artifact@v4
        with:
          name: coreboot-4430s
          path: coreboot/build/coreboot.rom
          if-no-files-found: error
