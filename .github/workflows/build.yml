name: Build coreboot for HP ProBook 4430s

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # lets you trigger a build from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out port
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ gnat-14 bison flex m4 \
            zlib1g-dev libssl-dev libncurses-dev \
            python3 python3-pip \
            git curl wget xz-utils bzip2 patch \
            acpica-tools nasm uuid-dev imagemagick

      - name: Build coreboot.rom (clone + crossgcc + make)
        run: bash ci_build.sh

      - name: Upload coreboot.rom
        uses: actions/upload-artifact@v4
        with:
          name: coreboot-4430s
          path: coreboot/build/coreboot.rom
          if-no-files-found: error
